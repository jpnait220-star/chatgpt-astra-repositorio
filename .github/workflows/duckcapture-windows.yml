name: DuckCapture Windows
on:
  push:
    branches: [duckcapture-0.5.1]
    paths: ['duckcapture/**', '.github/workflows/duckcapture-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duckcapture-windows-051
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: duckcapture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            duckcapture/requirements.txt
            duckcapture/requirements-build.txt
      - name: Dependências
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Compilar e verificar o aplicativo Windows
        shell: python
        run: |
          import json, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from scripts import build_windows as build
          try:
              build.PY = Path(sys.executable)
              build.LOG.write_text('DuckCapture 0.5.1 / GitHub Windows build\n', encoding='utf-8')
              source, stage = build.make_windows_exe()
              report = (build.ROOT / 'installer_saida' / 'verificacao-windows.json').resolve()
              subprocess.run([str(source / 'DuckCapture.exe'), '--check-installation', str(report)], timeout=90, check=True)
              print(report.read_text())
              assert json.loads(report.read_text())['ok']
              build.compile_installer(build.ensure_iscc(automatic=False), source)
          except Exception:
              import traceback
              report = Path('installer_saida/verificacao-windows.json')
              detail = traceback.format_exc() + ('\n'+report.read_text() if report.exists() else '')
              if build.LOG.exists():
                  detail += '\n' + build.LOG.read_text(encoding='utf-8')[-5000:]
              print('::error title=Compilação Windows::' + detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
              raise
      - name: Empacotar código-fonte e checksums
        shell: python
        run: |
          import hashlib, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from scripts.package import package
          package(Path('installer_saida'))
          exe = Path('installer_saida/DuckCapture-Setup-0.5.1.exe')
          exe.with_suffix('.exe.sha256').write_text(hashlib.sha256(exe.read_bytes()).hexdigest()+'  '+exe.name+'\n')
      - name: Publicar downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view DuckCapture-v0.5.1 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create DuckCapture-v0.5.1 --target $env:GITHUB_SHA --title "DuckCapture 0.5.1" --prerelease --notes-file ATUALIZACAO-0.5.1.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload DuckCapture-v0.5.1 installer_saida/DuckCapture-Setup-0.5.1.exe installer_saida/DuckCapture-Setup-0.5.1.exe.sha256 installer_saida/DuckCapture-0.5.1.zip installer_saida/DuckCapture-0.5.1.zip.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duckcapture-windows-build
          path: |
            duckcapture/installer_saida/*
            duckcapture/erro-build.log
          retention-days: 14
